name: permission_master
description: "**Permission Master** is a **Flutter** plugin for managing and requesting permissions on **All Platform**."
version: 0.1.0
homepage: "https://github.com/SwanFlutter/permission_master"

environment:
  sdk: ^3.10.4
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.1
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:

  plugin:
    platforms:
      android:
        package: com.example.permission_master
        pluginClass: PermissionMasterPlugin
      ios:
        pluginClass: PermissionMasterPlugin
      linux:
        pluginClass: PermissionMasterPlugin
      macos:
        pluginClass: PermissionMasterPlugin
      windows:
        pluginClass: PermissionMasterPluginCApi
      web:
        pluginClass: PermissionMasterWeb
        fileName: permission_master_web.dart


