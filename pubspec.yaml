name: permission_master
description: "**Permission Master** is a **Flutter** plugin for managing and requesting permissions on **iOS** and **Android**, making development easier."
version: 0.0.3
homepage: "https://github.com/SwanFlutter/permission_master"

environment:
  sdk: ^3.7.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0


flutter:

  plugin:
    platforms:
      android:
        package: com.example.permission_master
        pluginClass: PermissionMasterPlugin
      ios:
        pluginClass: PermissionMasterPlugin


